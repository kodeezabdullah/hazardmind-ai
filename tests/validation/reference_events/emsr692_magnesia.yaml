# SUPERSEDED for the scored baseline (2026-07-28), same pattern as
# emsr773_valencia.yaml being superseded by emsr773_paiporta.yaml: this file
# uses the full ~150km x 90km Magnesia regional-unit AOI as the pipeline's
# search location, which is not how the pipeline is normally operated
# (production runs are town/city scale) and risks the same multi-hour
# multi-tile search the original province-wide Valencia attempt hit. Kept
# for the record; emsr692_kanalia.yaml (rescoped to a village on the
# Storm-Daniel-flooded Lake Karla basin) is the event actually run for the
# scored baseline going forward. status: confirmed is left as-is below
# (the reference data itself is still valid) but this file is not part of
# the normal scored run set -- run_baseline.py has no separate
# "superseded" status value, so exclude it manually with --event when
# reproducing the baseline, same as emsr773_valencia.yaml.
